databaseChangeLog:
  - changeSet:
      id: 001-enable-monitoring-uuid-extension
      author: Andrey Gómez
      labels: "HU-07-dev,ddl,base,extensions"
      comment: Enables the uuid-ossp extension for monitoring UUID values.
      changes:
        - sqlFile:
            path: 001_enable_uuid_extension.sql
