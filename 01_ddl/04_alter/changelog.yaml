databaseChangeLog:
  - changeSet:
      id: 001-create-monitoring-constraints
      author: Andrey Gómez
      labels: "HU-07-dev,ddl,base,constrains"
      comment: Creates primary key and foreign key constraints for monitoring tables.
      changes:
        - sqlFile:
            path: 001_create_monitoring_constraints.sql
            relativeToChangelogFile: true
            stripComments: false
      rollback:
        - sqlFile:
            path: ../../05_rollbacks/01_ddl/04_constrains/001_create_monitoring_constraints.rollback.sql
            relativeToChangelogFile: true
            stripComments: false

  - changeSet:
      id: quality-fixes-monitoring-950
      author: jesus-gonzalez
      labels: "quality,v2"
      comment: id DEFAULT gen_random_uuid e indices de FK faltantes
      changes:
        - sqlFile: {path: 950_quality_fixes.sql, relativeToChangelogFile: true, splitStatements: true, stripComments: false}
      rollback:
        - sql: {sql: "SELECT 1;"}

  - changeSet:
      id: remediation-monitoring-960
      author: jesus-gonzalez
      labels: "remediation,congruence,v2"
      comment: "R3: 5 ENUM nativos -> VARCHAR+CHECK (ADR-004)"
      changes:
        - sqlFile: {path: 960_remediation.sql, relativeToChangelogFile: true, splitStatements: true, stripComments: false}
      rollback:
        - sqlFile: {path: ../../05_rollbacks/01_ddl/04_alter/960_remediation.rollback.sql, relativeToChangelogFile: true, stripComments: false}

  - changeSet:
      id: remediation-monitoring-961
      author: jesus-gonzalez
      labels: "remediation,congruence,v2,partition"
      comment: "R3: kpi_tracking particionada por RANGE mensual de measured_at (PK incluye la clave de partición)"
      changes:
        - sqlFile: {path: 961_remediation_partition.sql, relativeToChangelogFile: true, splitStatements: true, stripComments: false}
      rollback:
        - sqlFile: {path: ../../05_rollbacks/01_ddl/04_alter/961_remediation_partition.rollback.sql, relativeToChangelogFile: true, stripComments: false}

  - changeSet:
      id: refinamiento-monitoring-notification-970
      author: jesus-gonzalez
      labels: "refinamiento,notification,v2"
      comment: "Notificacion accionable: is_read/read_at, category, priority, deep_link, source_event_id/type"
      changes:
        - sqlFile: {path: 970_refinamiento_notification.sql, relativeToChangelogFile: true, splitStatements: true, stripComments: false}
      rollback:
        - sqlFile: {path: ../../05_rollbacks/01_ddl/04_alter/970_refinamiento_notification.rollback.sql, relativeToChangelogFile: true, stripComments: false}

  # NOTE: hu-mon-f3-drop-notification-980 (DROP TABLE monitoring.sent_notification) lives
  # physically in this folder (980_hu_mon_f3_drop_notification.sql) but its changeSet is
  # registered at the end of 01_ddl/10_indexes/changelog.yaml instead of here. Reason: the
  # pre-existing 002-create-monitoring-indexes changeset (01_ddl/10_indexes) still creates
  # idx_sent_notification_recipient/idx_sent_notification_pending on sent_notification and
  # executes AFTER 04_alter in a from-scratch run; registering the DROP here would break
  # that already-applied changeset on every environment. It must run after every existing
  # changeset that still references sent_notification (last one: 10_indexes/980-dedup).

  - changeSet:
      id: hu-mon-001-kpi-partitions-append-only-990
      author: codex
      labels: "HU-MON-001,ddl,partition,append-only"
      comment: "HU-MON-001: monthly kpi_tracking partitions, append-only trigger, named generated_alert exclusive arc"
      changes:
        - sqlFile: {path: 990_hu_mon_001_kpi_partitions_append_only.sql, relativeToChangelogFile: true, splitStatements: false, stripComments: false}
      rollback:
        - sqlFile: {path: ../../05_rollbacks/01_ddl/04_alter/990_hu_mon_001_kpi_partitions_append_only.rollback.sql, relativeToChangelogFile: true, stripComments: false}
