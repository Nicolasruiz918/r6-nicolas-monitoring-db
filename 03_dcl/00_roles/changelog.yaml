databaseChangeLog:
  - changeSet:
      id: dcl-roles-monitoring-001
      author: jesus-gonzalez
      labels: "dcl,roles"
      comment: Roles reader/writer/admin del dominio monitoring
      changes:
        - sqlFile: {path: 001_create_roles.sql, relativeToChangelogFile: true, splitStatements: false, stripComments: false}
      rollback:
        - sql: {sql: "DROP ROLE IF EXISTS monitoring_reader; DROP ROLE IF EXISTS monitoring_writer; DROP ROLE IF EXISTS monitoring_admin;"}
